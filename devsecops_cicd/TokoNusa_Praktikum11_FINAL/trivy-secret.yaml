# Aturan khusus PRAKTIKUM, bukan kebijakan produksi.
# Memastikan placeholder AWS yang dipakai di modul tetap diperlakukan
# sebagai temuan, sekalipun built-in rule Trivy mengizinkan contoh publik.
# Built-in allow rule 'examples' mengabaikan teks yang mengandung kata 'example'.
# Kunci contoh AWS memuat 'EXAMPLE', jadi allow rule itu dinonaktifkan di sini.
disable-allow-rules:
  - examples
rules:
  - id: tokonusa-demo-aws-access-key
    category: AWS
    title: Hardcoded AWS-style access key (simulasi TokoNusa)
    severity: HIGH
    path: '.*\.py$'
    keywords:
      - AWS_ACCESS_KEY_ID
    regex: 'AWS_ACCESS_KEY_ID\s*=\s*["''](?P<secret>AKIA[0-9A-Z]{16})["'']'
    secret-group-name: secret
